name: Release Build

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Revision for the release'
        required: true
        default: '55.0.0-ignore00'

env:
  REPO_OWNER: owlcms
  MAVEN_OPTS: '-Xmx2048m'

