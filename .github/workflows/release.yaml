      - name: Clone Target Repository
        run: |
          mkdir ../new-repo
          git clone https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/owlcms/owlcms4${{ env.RELEASE_SUFFIX }}.git ../new-repo
          cd ../new-repo
          echo cloning done
          git config --local --unset credential.helper
          git config --local credential.helper ""

      - name: Copy Docs Directory
        run: |
          rm -rf ../new-repo/docs
          cp -a docs ../new-repo/docs

      - name: Push Updated Docs to Target Repository
        run: |
          cd ../new-repo
          git add docs
          git commit -m "Update docs from source repo"
          git push https://${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/owlcms/owlcms4${{ env.RELEASE_SUFFIX }}.git master
