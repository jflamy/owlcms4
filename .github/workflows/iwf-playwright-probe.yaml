name: IWF Playwright Access Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile Playwright probe
        run: >-
          mvn -B -pl playwright -DskipTests compile
          dependency:build-classpath
          -Dmdep.outputFile=target/playwright-classpath.txt
          -DincludeScope=runtime

      - name: Install Playwright Chromium
        run: >-
          java -cp "playwright/target/classes:$(cat playwright/target/playwright-classpath.txt)"
          com.microsoft.playwright.CLI install --with-deps chromium

      - name: Probe IWF pages
        id: iwf-probe
        run: |
          set -o pipefail
          mkdir -p playwright/iwf-access-probe
          cd playwright
          java -cp "target/classes:$(cat target/playwright-classpath.txt)" \
            playwright.IwfAccessProbe 2>&1 | tee iwf-access-probe/action.log

      - name: Upload probe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iwf-playwright-probe-${{ github.run_id }}
          path: playwright/iwf-access-probe/
          if-no-files-found: warn
          retention-days: 14

      - name: Write job summary
        if: always()
        run: |
          echo "## IWF Playwright Access Probe" >> "$GITHUB_STEP_SUMMARY"
          echo "- Probe outcome: ${{ steps.iwf-probe.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runner: ${{ runner.os }} / ${{ runner.arch }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser: Playwright bundled Chromium" >> "$GITHUB_STEP_SUMMARY"
          echo "- Diagnostics artifact: iwf-playwright-probe-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"