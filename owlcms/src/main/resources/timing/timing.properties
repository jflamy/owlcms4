# Athlete timer milestone values in milliseconds.
# Copy this file to the local/ directory (or the directory set by OWLCMS_LOCALDIR)
# under timing/timing.properties to override the defaults.
# Environment variables OWLCMS_ATHLETE_TIMER_ONE_MINUTE and
# OWLCMS_ATHLETE_TIMER_TWO_MINUTES override the corresponding file values.
# Sound values are basenames. The server resolves .wav and the browser resolves .mp3.
athleteTimerTwoMinutes=120000
athleteTimerInitialWarning=90000
athleteTimerOneMinute=60000
athleteTimerFinalWarning=30000
athleteTimerInitialWarningSound=initialWarning
athleteTimerFinalWarningSound=finalWarning
athleteTimerTimeOverSound=timeOver

# Break timer milestone values in milliseconds.
breakTimerInitialWarning=60000
breakTimerFinalWarning=30000
breakTimerInitialWarningSound=initialWarning
breakTimerFinalWarningSound=finalWarning
breakTimerTimeOverSound=timeOver

# Decision and jury display durations in milliseconds.
# decisionVisibleDuration: how long the referee decision is shown before the competition moves to the next
#   athlete; also how long the attempt board shows a jury outcome before going back to the current athlete.
# juryDecisionHold: how long the attempt board stays on the athlete under review after the last jury vote.
# juryOutcomeCardDuration: how long the attempt board shows the jury outcome card.
# decisionBlockHold: how long the scoreboard decision block shows the prior decision or the jury outcome.
decisionVisibleDuration=3500
juryDecisionHold=10000
juryOutcomeCardDuration=5000
decisionBlockHold=20000
