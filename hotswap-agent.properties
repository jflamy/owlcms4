# Hotswap Agent Configuration for OWLCMS4
# Disable problematic plugins for JDK 25 compatibility
WatchResources.disabled=true

# Enable key plugins for Java development
Hibernate.disabled=false
Spring.disabled=false
SpringBoot.disabled=false
Logback.disabled=false
JdkPlugin.disabled=false
Hotswapper.disabled=false

# Configure logging
LOGGER=INFO

# Optional: Configure extra classpath and watch directories
# extraClasspath=./target/classes,./target/test-classes
# watchResources=./src/main/resources