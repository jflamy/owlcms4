<!DOCTYPE html>
<html>
<head>
  	<meta property="og:title" content="OWLCMS">
	<meta property="og:description" content="Olympic Weightlifting Competition Management System">
	<meta property="og:image" content="https://jflamy.github.io/owlcms4/img/Records/records.png">
	<meta property="og:url" content="https://jflamy.github.io/owlcms4/#/">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
<!-- Theme: Simple -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Two+Tone|Material+Icons+Round|Material+Icons+Sharp" rel="stylesheet"/>
<style>
-webkit-filter: contrast(110%);
</style>
</head>
<body>
  <div id="app"></div>
	<script src="route-map.js"></script>
  <script>
		function redirectLegacyRoute() {
			const match = window.location.hash.match(/^#\/([^?#]*)(.*)$/);
			if (!match) return;
			const destination = window.owlcmsDocRoutes[match[1].replace(/\.md$/, '')];
			if (destination) window.location.replace('#/' + destination + match[2]);
		}
		redirectLegacyRoute();
		window.addEventListener('hashchange', redirectLegacyRoute);
    window.$docsify = {
    	homepage: 'index.md',
    	loadNavbar: false,
    	loadSidebar: true,
			relativePath: true,
			alias: { '/.*/_sidebar.md': '/_sidebar.md' },
			plugins: [function (hook, vm) {
				hook.afterEach(function (html) {
					const pageUrl = new URL(vm.route.path.replace(/^\//, ''), document.baseURI);
					return html.replace(/<img\b[^>]*>/gi, function (tag) {
						return tag.replace(/(\bsrc\s*=\s*)(["'])(.*?)\2/gi, function (whole, lead, quote, source) {
							if (/^(?:[a-z][a-z\d+.-]*:|\/|#)/i.test(source)) return whole;
							return lead + quote + new URL(source, pageUrl).href + quote;
						});
					});
				});
			}],
    	subMaxLevel: 2,
    	name: 'OWLCMS',
    	autoHeader: true,
    	mergeNavbar: true,
    	auto2top: true
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.9.4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.9.4/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code"></script>
  <script src="https://cdn.jsdelivr.net/npm/@sy-records/docsify-footnotes/lib/index.min.js"></script>
</body>
</html>
